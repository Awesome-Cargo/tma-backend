services:
  api:
    container_name: tma-backend-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-tma_backend}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: tma-mongo-tests
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-tma_backend}
    volumes:
      - mongo_data_test:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data_test: